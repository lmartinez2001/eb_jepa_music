meta:
  seed: 2025
  device: auto
  model_folder:
  save_dir:             # explicit checkpoint dir; defaults to the experiment folder
  load_model: false
  load_checkpoint: latest.pth.tar

data:
  loader: music.datasets.aistpp_v2.build_loaders
  batch_size: 128
  num_workers: 4
  window: 60
  horizon: 60        # frame offset between consecutive prediction steps (= window → non-overlapping)
  pred_horizon: 3    # number of future steps to predict; must match model.predictor.horizon
  stride: null       # null = non-overlapping between samples (stride = window)
  data_root: /lustre/work/vivatech-4dudes/shared/datasets/aistpp_v3
  fps: 30
  sample_rate: 24000
  audio_chunk_frames: 150
  val_fraction: 0.1

model:
  encoder:
    dim_in: 3
    dim_out: 3
    dim_feat: 512
    dim_rep: 512
    depth: 8
    num_heads: 8
    mlp_ratio: 2
    num_joints: 25
    maxlen: 60
    dropout: 0.0
    attn_dropout: 0.0
    drop_path: 0.0
    att_fuse: true

  music_encoder:
    # By default music/main.py uses music.models.audio_encoder.AudioEncoder.
    # Set target to override, e.g. "my_pkg.my_module.build_music_encoder".
    target:
    model_name: OpenMuQ/MuQ-large-msd-iter
    # dim: no longer controls AudioEncoder output (pooling moved to predictor).
    # MuQ output dim is 1024; predictor's music_pool handles 1024 → predictor.dim.
    freeze: true
    chunk_frames: 120
    fps: 30
    sample_rate: 24000

  predictor:
    target: transformer   # "rnn" for MusicRNNPredictor, "transformer" for MusicTransformerPredictor
    num_layers: 4
    final_ln: true
    dim: 512
    num_heads: 8
    ff_mult: 4
    dropout: 0.0
    horizon: 3            # must match data.pred_horizon

loss:
  type: vicreg   # "sigreg" (BCS / Epps-Pulley Gaussianity) or "vicreg" (hinge-std + covariance)
  # SIGReg params (used when type: sigreg)
  bcs_coeff: 10.0
  bcs_slices: 256
  # VICReg params (used when type: vicreg)
  std_coeff: 10.0
  cov_coeff: 1.0

optim:
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-6
  warmup_ratio: 0.1
  grad_clip: 2.0

training:
  use_amp: true
  dtype: bfloat16

logging:
  project: eb_jepa
  log_wandb: false
  wandb_group:
  wandb_sweep_id:
  log_every: 10
  val_every: 1
  save_every: 10
  tqdm_silent: false

# --- Parameters used when running with --full-sweep
# Keep data.window and model.encoder.maxlen fixed together unless your launcher
# supports tied parameters. Sweeping horizon changes prediction difficulty
# without changing the MotionBERT tensor shape.
sweep:
  param_grid:
    model.encoder.dim_feat: [256, 512]
    model.encoder.dim_rep: [512]
    model.encoder.depth: [8]
    model.predictor.num_layers: [4]
    loss.std_coeff: [4.0, 10.0]
    loss.cov_coeff: [0.1, 1.0]
    optim.lr: [0.00005, 0.0001, 0.0003]
    optim.weight_decay: [0.000001]
    meta.seed: [1, 1000, 10000]
